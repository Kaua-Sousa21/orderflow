<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>OrderFlow - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dashboard-body">

<div class="sidebar">
    <h2>OrderFlow</h2>

    <a class="active" href="dashboard.html">Dashboard</a>
    <a href="products.html">Produtos</a>
    <a href="orders.html">Pedidos</a>
    <a href="history.html">Histórico</a>

    <button onclick="logout()">Sair</button>
</div>

<main class="main-content">
    <header class="topbar">
        <div>
            <h1>Dashboard</h1>
            <p>Resumo geral do seu sistema de pedidos</p>
        </div>
    </header>
    <section class="panel chart-panel">
        <div class="table-header">
            <h2>Pedidos por Status</h2>
            <p>Distribuição atual dos pedidos no sistema</p>
        </div>

        <canvas id="ordersStatusChart"></canvas>
    </section>

    <section class="cards">

        <div class="card">
            <span>📦 Total de Pedidos</span>
            <h2 id="totalOrders">0</h2>
        </div>

        <div class="card">
            <span>🔥 Pedidos Ativos</span>
            <h2 id="activeOrders">0</h2>
        </div>

        <div class="card">
            <span>🟡 Pendentes</span>
            <h2 id="pendingOrders">0</h2>
        </div>

        <div class="card">
            <span>🔵 Preparando</span>
            <h2 id="preparingOrders">0</h2>
        </div>

        <div class="card">
            <span>🟢 Prontos</span>
            <h2 id="readyOrders">0</h2>
        </div>

        <div class="card">
            <span>💰 Faturamento</span>
            <h2 id="totalRevenue">R$ 0,00</h2>
        </div>

    </section>
</main>
<script src="js/admin-guard.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
