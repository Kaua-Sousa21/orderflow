<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>OrderFlow - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">

<div class="sidebar">
    <h2>OrderFlow</h2>

    <a class="active" href="dashboard.html">Dashboard</a>
    <a href="products.html">Produtos</a>
    <a href="orders.html">Pedidos</a>

    <button onclick="logout()">Sair</button>
</div>

<main class="main-content">
    <header class="topbar">
        <div>
            <h1>Dashboard</h1>
            <p>Resumo geral do seu sistema de pedidos</p>
        </div>
    </header>

    <section class="cards">
        <div class="card">
            <span>Total de pedidos</span>
            <h2 id="totalOrders">0</h2>
        </div>

        <div class="card">
            <span>Pedidos pendentes</span>
            <h2 id="pendingOrders">0</h2>
        </div>

        <div class="card">
            <span>Receita total</span>
            <h2 id="totalRevenue">R$ 0,00</h2>
        </div>
    </section>

    <section class="panel">
        <h2>Bem-vindo ao OrderFlow</h2>
        <p>Gerencie seus produtos, acompanhe pedidos e visualize o desempenho do sistema em tempo real.</p>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
